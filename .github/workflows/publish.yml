name: Publish usebrix

on:
  workflow_dispatch:
    inputs:
      version:
        description: npm version to publish, for example 0.1.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be strict semver like 0.1.1"
            exit 1
          fi
          if npm_out=$(npm view "usebrix@${VERSION}" version 2>&1); then
            echo "::error::Version ${VERSION} already exists on npm as usebrix@${VERSION}."
            exit 1
          fi
          if ! printf '%s' "$npm_out" | grep -q 'E404'; then
            echo "::error::Could not check npm for usebrix@${VERSION}."
            printf '%s\n' "$npm_out"
            exit 1
          fi
          tag_ref=$(git ls-remote --tags origin "refs/tags/v${VERSION}")
          if [ -n "$tag_ref" ]; then
            echo "::error::Version ${VERSION} already exists on GitHub as tag v${VERSION}."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Set package version
        working-directory: packages/cli
        env:
          VERSION: ${{ inputs.version }}
        run: npm pkg set "version=${VERSION}"

      - name: Commit version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- packages/cli/package.json; then
            echo "Version already set"
          else
            git add packages/cli/package.json
            git commit -m "Release usebrix ${VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish to npm
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag latest

      - name: Create GitHub Release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --target "$(git rev-parse HEAD)" \
            --title "usebrix ${VERSION}" \
            --notes "$(printf '%s\n' "https://www.npmjs.com/package/usebrix/v/${VERSION}" "" "npx usebrix@${VERSION} init")"
