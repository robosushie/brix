name: Publish usebrix

on:
  workflow_dispatch:
    inputs:
      version:
        description: npm version to publish, for example 0.1.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be strict semver like 0.1.1"
            exit 1
          fi
          if npm view "usebrix@${VERSION}" version >/dev/null 2>&1; then
            echo "usebrix@${VERSION} is already on npm"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Set package version
        working-directory: packages/cli
        env:
          VERSION: ${{ inputs.version }}
        run: npm pkg set "version=${VERSION}"

      - name: Commit version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- packages/cli/package.json; then
            echo "Version already set"
          else
            git add packages/cli/package.json
            git commit -m "Release usebrix ${VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish to npm
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag latest

      - name: Push git tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
