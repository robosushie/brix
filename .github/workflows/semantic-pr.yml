name: Semantic PR

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  semantic-pr:
    name: semantic-pr
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            chore
            docs
            test
            style
          requireScope: false
          validateSingleCommit: true
          validateSingleCommitMatchesPrTitle: true
          subjectPattern: '^(?!.{73,})(?!.*\.$)(?![A-Z]).+$'
          subjectPatternError: |
            The subject "{subject}" in "{title}" must be an imperative summary:
            start with a lowercase letter, stay within 72 characters, and do not end with a period.
